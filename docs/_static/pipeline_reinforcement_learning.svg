<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 576" width="1180" height="576" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker><marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="arrp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c026d3"/></marker><marker id="arrt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker></defs><rect x="1" y="1" width="1178" height="574" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="30" y="26" width="1120" height="142" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><text x="46" y="48" font-size="13.5" font-weight="600" fill="#64748b" text-anchor="start">StochasticPlanningProblem</text><rect x="50.0" y="70" width="252.0" height="76" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/><text x="176.0" y="103.0" font-size="15" font-weight="650" fill="#0c4a6e" text-anchor="middle">Plant</text><text x="176.0" y="124.0" font-size="14" font-weight="400" fill="#0c4a6e" text-anchor="middle">ẋ = f(x, u, w)</text><rect x="326.0" y="70" width="252.0" height="76" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/><text x="452.0" y="103.0" font-size="15" font-weight="650" fill="#0c4a6e" text-anchor="middle">Cost</text><text x="452.0" y="124.0" font-size="14" font-weight="400" fill="#0c4a6e" text-anchor="middle">reward r = −g dt</text><rect x="602.0" y="70" width="252.0" height="76" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/><text x="728.0" y="103.0" font-size="15" font-weight="650" fill="#0c4a6e" text-anchor="middle">Sets</text><text x="728.0" y="124.0" font-size="14" font-weight="400" fill="#0c4a6e" text-anchor="middle">leave X: a failure</text><rect x="878.0" y="70" width="252.0" height="76" rx="8" fill="#fae8ff" stroke="#c026d3" stroke-width="1.5"/><text x="1004.0" y="103.0" font-size="15" font-weight="650" fill="#701a75" text-anchor="middle">Distributions</text><text x="1004.0" y="124.0" font-size="14" font-weight="400" fill="#701a75" text-anchor="middle">x₀ ~ X0,  θp ~ Θ</text><rect x="30" y="192" width="1120" height="156" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><text x="46" y="214" font-size="13.5" font-weight="600" fill="#64748b" text-anchor="start">RolloutEnvironment · the step model of the problem</text><path d="M590,168 L590,190" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr)"/><rect x="50" y="226" width="330" height="96" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="215.0" y="259.0" font-size="15" font-weight="650" fill="#0f172a" text-anchor="middle">Step</text><text x="215.0" y="280.0" font-size="14" font-weight="400" fill="#0f172a" text-anchor="middle">xₖ₊₁ = Φ(xₖ, uₖ)</text><text x="215.0" y="301.0" font-size="14" font-weight="400" fill="#0f172a" text-anchor="middle">the plant held over dt</text><rect x="420" y="226" width="330" height="96" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="585.0" y="259.0" font-size="15" font-weight="650" fill="#0f172a" text-anchor="middle">Reward and end</text><text x="585.0" y="280.0" font-size="14" font-weight="400" fill="#0f172a" text-anchor="middle">rₖ = −g(xₖ, uₖ) dt</text><text x="585.0" y="301.0" font-size="14" font-weight="400" fill="#0f172a" text-anchor="middle">done when x ∉ X, or at the horizon</text><rect x="790" y="226" width="340" height="96" rx="8" fill="#fae8ff" stroke="#c026d3" stroke-width="1.5"/><text x="960.0" y="259.0" font-size="15" font-weight="650" fill="#701a75" text-anchor="middle">Reset</text><text x="960.0" y="280.0" font-size="14" font-weight="400" fill="#701a75" text-anchor="middle">x₀ drawn from X0</text><text x="960.0" y="301.0" font-size="14" font-weight="400" fill="#701a75" text-anchor="middle">one seed per episode</text><path d="M410,348 L410,390" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr)"/><rect x="50" y="392" width="220" height="96" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="160.0" y="425.0" font-size="15" font-weight="650" fill="#0f172a" text-anchor="middle">Policy πθ</text><text x="160.0" y="446.0" font-size="14" font-weight="400" fill="#0f172a" text-anchor="middle">u ~ πθ(· | x)</text><text x="160.0" y="467.0" font-size="14" font-weight="400" fill="#0f172a" text-anchor="middle">a neural network</text><rect x="300" y="392" width="220" height="96" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="410.0" y="425.0" font-size="15" font-weight="650" fill="#0f172a" text-anchor="middle">Collect</text><text x="410.0" y="446.0" font-size="14" font-weight="400" fill="#0f172a" text-anchor="middle">episodes, one scan</text><text x="410.0" y="467.0" font-size="14" font-weight="400" fill="#0f172a" text-anchor="middle">vmap over envs</text><rect x="550" y="392" width="220" height="96" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="660.0" y="425.0" font-size="15" font-weight="650" fill="#0f172a" text-anchor="middle">Returns</text><text x="660.0" y="446.0" font-size="14" font-weight="400" fill="#0f172a" text-anchor="middle">Gₖ = Σⱼ γʲ rₖ₊ⱼ</text><text x="660.0" y="467.0" font-size="14" font-weight="400" fill="#0f172a" text-anchor="middle">advantages, critic</text><rect x="800" y="392" width="230" height="96" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="915.0" y="425.0" font-size="15" font-weight="650" fill="#0f172a" text-anchor="middle">Update θ</text><text x="915.0" y="446.0" font-size="14" font-weight="400" fill="#0f172a" text-anchor="middle">θ ← θ + η ∇θ E[G]</text><text x="915.0" y="467.0" font-size="14" font-weight="400" fill="#0f172a" text-anchor="middle">PPO · SAC · REINFORCE</text><path d="M270,440.0 L298,440.0" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr)"/><path d="M520,440.0 L548,440.0" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr)"/><path d="M770,440.0 L798,440.0" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr)"/><path d="M915.0,488 C915.0,534 160.0,534 160.0,490" fill="none" stroke="#64748b" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arr)"/><text x="537.5" y="538" font-size="12.5" font-weight="500" fill="#64748b" text-anchor="middle">repeat: collect with the updated policy</text><path d="M1030,440.0 L1053,440.0" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr)"/><rect x="1055.0" y="420.0" width="78" height="40" rx="20.0" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="1094" y="444.5" font-size="15" font-weight="700" fill="#14532d" text-anchor="middle">π(x)</text><text x="1094" y="480.0" font-size="12.5" font-weight="500" fill="#14532d" text-anchor="middle">PlanningSolution</text></svg>