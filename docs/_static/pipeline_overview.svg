<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 450" width="1180" height="450" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker><marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="arrp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c026d3"/></marker><marker id="arrt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker></defs><rect x="1" y="1" width="1178" height="448" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="390" y="30" width="400" height="70" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/><text x="590.0" y="60.0" font-size="15" font-weight="650" fill="#0c4a6e" text-anchor="middle">PlanningProblem</text><text x="590.0" y="81.0" font-size="14" font-weight="400" fill="#0c4a6e" text-anchor="middle">plant · cost · sets · start · horizon</text><path d="M590,100 C590,136 150.0,128 150.0,162" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr)"/><rect x="50" y="164" width="200" height="92" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="150.0" y="195.0" font-size="15" font-weight="650" fill="#0f172a" text-anchor="middle">LQR</text><text x="150.0" y="216.0" font-size="14" font-weight="400" fill="#0f172a" text-anchor="middle">linearize + Riccati</text><text x="150.0" y="237.0" font-size="14" font-weight="400" fill="#0f172a" text-anchor="middle">u = ū − K(x − x̄)</text><path d="M150.0,256 C150.0,294 385,292 385,330" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr)"/><path d="M590,100 C590,136 370.0,128 370.0,162" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr)"/><rect x="270" y="164" width="200" height="92" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="370.0" y="195.0" font-size="15" font-weight="650" fill="#0f172a" text-anchor="middle">Dynamic programming</text><text x="370.0" y="216.0" font-size="14" font-weight="400" fill="#0f172a" text-anchor="middle">Bellman on a grid</text><text x="370.0" y="237.0" font-size="14" font-weight="400" fill="#0f172a" text-anchor="middle">u = π(x), J(x)</text><path d="M370.0,256 C370.0,294 385,292 385,330" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr)"/><path d="M590,100 C590,136 590.0,128 590.0,162" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr)"/><rect x="490" y="164" width="200" height="92" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="590.0" y="195.0" font-size="15" font-weight="650" fill="#0f172a" text-anchor="middle">Trajectory optimization</text><text x="590.0" y="216.0" font-size="14" font-weight="400" fill="#0f172a" text-anchor="middle">transcription + NLP</text><text x="590.0" y="237.0" font-size="14" font-weight="400" fill="#0f172a" text-anchor="middle">u = π(t), x*(t)</text><path d="M590.0,256 C590.0,294 385,292 385,330" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr)"/><path d="M590,100 C590,136 810.0,128 810.0,162" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr)"/><rect x="710" y="164" width="200" height="92" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="810.0" y="195.0" font-size="15" font-weight="650" fill="#0f172a" text-anchor="middle">Reinforcement learning</text><text x="810.0" y="216.0" font-size="14" font-weight="400" fill="#0f172a" text-anchor="middle">collect + update θ</text><text x="810.0" y="237.0" font-size="14" font-weight="400" fill="#0f172a" text-anchor="middle">u = π(x; θ)</text><path d="M810.0,256 C810.0,294 385,292 385,330" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr)"/><path d="M590,100 C590,136 1030.0,128 1030.0,162" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr)"/><rect x="930" y="164" width="200" height="92" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="1030.0" y="195.0" font-size="15" font-weight="650" fill="#0f172a" text-anchor="middle">RRT</text><text x="1030.0" y="216.0" font-size="14" font-weight="400" fill="#0f172a" text-anchor="middle">kinodynamic tree</text><text x="1030.0" y="237.0" font-size="14" font-weight="400" fill="#0f172a" text-anchor="middle">u = π(t)</text><path d="M1030.0,256 C1030.0,294 385,292 385,330" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr)"/><rect x="260" y="332" width="250" height="96" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/><text x="385.0" y="365.0" font-size="15" font-weight="650" fill="#0c4a6e" text-anchor="middle">PlanningSolution</text><text x="385.0" y="386.0" font-size="14" font-weight="400" fill="#0c4a6e" text-anchor="middle">policy · trajectory</text><text x="385.0" y="407.0" font-size="14" font-weight="400" fill="#0c4a6e" text-anchor="middle">and the solver's log</text><rect x="560" y="332" width="230" height="96" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/><text x="675.0" y="365.0" font-size="15" font-weight="650" fill="#0c4a6e" text-anchor="middle">Closed loop</text><text x="675.0" y="386.0" font-size="14" font-weight="400" fill="#0c4a6e" text-anchor="middle">solution.policy @ plant</text><text x="675.0" y="407.0" font-size="14" font-weight="400" fill="#0c4a6e" text-anchor="middle">you connect it</text><rect x="840" y="332" width="300" height="96" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="990.0" y="365.0" font-size="15" font-weight="650" fill="#0f172a" text-anchor="middle">ProblemEvaluator</text><text x="990.0" y="386.0" font-size="14" font-weight="400" fill="#0f172a" text-anchor="middle">simulate, score J and margins</text><text x="990.0" y="407.0" font-size="14" font-weight="400" fill="#0f172a" text-anchor="middle">→ Evaluation, compare(…)</text><path d="M510,380.0 L558,380.0" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr)"/><path d="M790,380.0 L838,380.0" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr)"/></svg>