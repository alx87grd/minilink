<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 250" width="1000" height="250" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="sys-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#52525b"/>
    </marker>
  </defs>
  <style>
    .canvas { fill: #fafafa; stroke: #e5e7eb; }
    .card { fill: #eff6ff; stroke: #2563eb; stroke-width: 2.4; }
    .box { fill: #ffffff; stroke: #d4d4d8; stroke-width: 1.3; }
    .core { fill: #ffffff; stroke: #2563eb; stroke-width: 2.2; }
    .port { fill: #2563eb; stroke: #ffffff; stroke-width: 2; }
    .wire { stroke: #52525b; stroke-width: 1.8; fill: none; marker-end: url(#sys-ah); }
    .lead { stroke: #52525b; stroke-width: 1.8; fill: none; }
    .brace { stroke: #52525b; stroke-width: 2.2; fill: none; }
    .h2 { fill: #1e3a8a; font-size: 16px; font-weight: 700; }
    .g  { fill: #71717a; font-size: 15px; }
    .lab { fill: #3f3f46; font-size: 26px; font-style: italic; font-family: 'Times New Roman', Times, serif; }
    .lab-acc { fill: #2563eb; font-size: 22px; font-style: italic; font-family: 'Times New Roman', Times, serif; }
    .math { fill: #18181b; font-size: 22px; font-style: italic; font-family: 'Times New Roman', Times, serif; }
    .math-core { fill: #18181b; font-size: 30px; font-style: italic; font-family: 'Times New Roman', Times, serif; }
    .dot { fill: #3f3f46; }
    .bar { fill: #2563eb; }
  </style>

  <rect class="canvas" x="0.5" y="0.5" width="999" height="249" rx="16"/>
  <rect class="card" x="148" y="22" width="704" height="206" rx="16"/>
  <text class="h2" x="168" y="44">Dynamics</text>

  <path class="brace" d="M168,58 C196,58 196,104 216,104 C196,104 196,150 168,150"/>
  <text class="lab" x="226" y="113">u</text>

  <rect class="core" x="262" y="38" width="288" height="52" rx="10"/>
  <rect class="bar" x="262" y="48" width="5" height="32" rx="2"/>
  <text class="math-core" x="276" y="74">ẋ = f(x, u, t; p)</text>
  <line class="wire" x1="550" y1="64" x2="588" y2="64"/>
  <text class="lab-acc" x="569" y="54" text-anchor="middle">ẋ</text>

  <!-- one output equation, wired only to the top port -->
  <rect class="box" x="600" y="40" width="196" height="48" rx="8"/>
  <text class="math" x="698" y="72" text-anchor="middle">y = h(x, u, t; p)</text>
  <line class="lead" x1="796" y1="64" x2="852" y2="64"/>

  <!-- vdots directly under the h chip -->
  <circle class="dot" cx="698" cy="106" r="4"/>
  <circle class="dot" cx="698" cy="122" r="4"/>
  <circle class="dot" cx="698" cy="138" r="4"/>

  <rect class="box" x="262" y="128" width="288" height="48" rx="8"/>
  <text class="math" x="276" y="160">T = tf(x, u, t; p)</text>
  <line class="wire" x1="550" y1="152" x2="612" y2="152"/>
  <text class="g" x="624" y="157">transforms</text>

  <!-- input ports, left edge -->
  <text class="g" x="46" y="48" text-anchor="middle">Input</text>
  <text class="g" x="46" y="66" text-anchor="middle">ports</text>
  <line class="wire" x1="14" y1="64" x2="140" y2="64"/>
  <line class="wire" x1="14" y1="104" x2="140" y2="104"/>
  <line class="wire" x1="14" y1="144" x2="140" y2="144"/>
  <circle class="port" cx="148" cy="64" r="8"/>
  <circle class="port" cx="148" cy="104" r="8"/>
  <circle class="port" cx="148" cy="144" r="8"/>

  <!-- three output ports, right edge, same y as inputs -->
  <text class="g" x="968" y="48" text-anchor="middle">Output</text>
  <text class="g" x="968" y="66" text-anchor="middle">ports</text>
  <circle class="port" cx="852" cy="64" r="8"/>
  <circle class="port" cx="852" cy="104" r="8"/>
  <circle class="port" cx="852" cy="144" r="8"/>
  <line class="wire" x1="860" y1="64" x2="938" y2="64"/>
  <line class="wire" x1="860" y1="104" x2="938" y2="104"/>
  <line class="wire" x1="860" y1="144" x2="938" y2="144"/>
</svg>
