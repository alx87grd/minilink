<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="1000" height="280" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="sys-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#52525b"/>
    </marker>
  </defs>
  <style>
    .canvas { fill: #fafafa; stroke: #e5e7eb; }
    .card { fill: #eff6ff; stroke: #2563eb; stroke-width: 2.4; }
    .box { fill: #ffffff; stroke: #d4d4d8; stroke-width: 1.3; }
    .core { fill: #ffffff; stroke: #2563eb; stroke-width: 2.2; }
    .port { fill: #2563eb; stroke: #ffffff; stroke-width: 2; }
    .wire { stroke: #52525b; stroke-width: 1.8; fill: none; marker-end: url(#sys-ah); }
    .lead { stroke: #52525b; stroke-width: 1.8; fill: none; }
    .brace { stroke: #52525b; stroke-width: 2.2; fill: none; }
    .h2 { fill: #1e3a8a; font-size: 16px; font-weight: 700; }
    .g  { fill: #71717a; font-size: 15px; }
    .lab { fill: #3f3f46; font-size: 26px; font-style: italic; font-family: 'Times New Roman', Times, serif; }
    .lab-acc { fill: #2563eb; font-size: 22px; font-style: italic; font-family: 'Times New Roman', Times, serif; }
    .math { fill: #18181b; font-size: 20px; font-style: italic; font-family: 'Times New Roman', Times, serif; }
    .math-core { fill: #18181b; font-size: 32px; font-style: italic; font-family: 'Times New Roman', Times, serif; }
    .dot { fill: #3f3f46; }
    .bar { fill: #2563eb; }
  </style>

  <rect class="canvas" x="0.5" y="0.5" width="999" height="279" rx="16"/>
  <rect class="card" x="148" y="20" width="732" height="240" rx="16"/>
  <text class="h2" x="168" y="42">Dynamics</text>

  <path class="brace" d="M168,60 C198,60 198,132 220,132 C198,132 198,204 168,204"/>
  <text class="lab" x="230" y="141">u</text>

  <rect class="core" x="258" y="48" width="348" height="66" rx="10"/>
  <rect class="bar" x="258" y="60" width="6" height="42" rx="2"/>
  <text class="math-core" x="276" y="92">ẋ = f(x, u, t; params)</text>
  <line class="wire" x1="606" y1="81" x2="638" y2="81"/>
  <text class="lab-acc" x="622" y="70" text-anchor="middle">ẋ</text>

  <rect class="box" x="646" y="54" width="224" height="50" rx="8"/>
  <text class="math" x="758" y="86" text-anchor="middle">y = h(x, u, t; params)</text>
  <line class="lead" x1="870" y1="79" x2="880" y2="79"/>

  <circle class="dot" cx="758" cy="122" r="4"/>
  <circle class="dot" cx="758" cy="140" r="4"/>
  <circle class="dot" cx="758" cy="158" r="4"/>

  <rect class="box" x="258" y="186" width="348" height="50" rx="8"/>
  <text class="math" x="276" y="218">T = tf(x, u, t; params)</text>
  <line class="wire" x1="606" y1="211" x2="668" y2="211"/>
  <text class="g" x="680" y="216">transforms</text>

  <text class="g" x="46" y="52" text-anchor="middle">Input</text>
  <text class="g" x="46" y="70" text-anchor="middle">ports</text>
  <line class="wire" x1="14" y1="79" x2="140" y2="79"/>
  <line class="wire" x1="14" y1="132" x2="140" y2="132"/>
  <line class="wire" x1="14" y1="211" x2="140" y2="211"/>
  <circle class="port" cx="148" cy="79" r="8"/>
  <circle class="port" cx="148" cy="132" r="8"/>
  <circle class="port" cx="148" cy="211" r="8"/>

  <text class="g" x="968" y="52" text-anchor="middle">Output</text>
  <text class="g" x="968" y="70" text-anchor="middle">ports</text>
  <circle class="port" cx="880" cy="79" r="8"/>
  <circle class="port" cx="880" cy="132" r="8"/>
  <circle class="port" cx="880" cy="211" r="8"/>
  <line class="wire" x1="888" y1="79" x2="948" y2="79"/>
  <line class="wire" x1="888" y1="132" x2="948" y2="132"/>
  <line class="wire" x1="888" y1="211" x2="948" y2="211"/>
</svg>
