<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 450" width="1180" height="450" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker><marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="arrp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9333ea"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="30" y="26" width="1120" height="142" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><text x="46" y="48" font-size="13.5" font-weight="600" fill="#64748b" text-anchor="start">PlanningProblem</text><rect x="50.0" y="70" width="528.0" height="76" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/><text x="314.0" y="103.0" font-size="15" font-weight="650" fill="#0c4a6e" text-anchor="middle">Plant</text><text x="314.0" y="124.0" font-size="14" font-weight="400" fill="#0c4a6e" text-anchor="middle">ẋ = f(x, u)</text><rect x="602.0" y="70" width="528.0" height="76" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/><text x="866.0" y="103.0" font-size="15" font-weight="650" fill="#0c4a6e" text-anchor="middle">QuadraticCost</text><text x="866.0" y="124.0" font-size="14" font-weight="400" fill="#0c4a6e" text-anchor="middle">g = (x − x̄)ᵀQ(x − x̄) + (u − ū)ᵀR(u − ū)</text><path d="M205,168 L205,224" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr)"/><rect x="60" y="226" width="290" height="96" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="205.0" y="259.0" font-size="15" font-weight="650" fill="#0f172a" text-anchor="middle">Linearize at (x̄, ū)</text><text x="205.0" y="280.0" font-size="14" font-weight="400" fill="#0f172a" text-anchor="middle">A = ∂f/∂x,  B = ∂f/∂u</text><text x="205.0" y="301.0" font-size="14" font-weight="400" fill="#0f172a" text-anchor="middle">the model near the goal</text><rect x="410" y="226" width="380" height="96" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="600.0" y="259.0" font-size="15" font-weight="650" fill="#0f172a" text-anchor="middle">Riccati</text><text x="600.0" y="280.0" font-size="14" font-weight="400" fill="#0f172a" text-anchor="middle">AᵀP + PA − PBR⁻¹BᵀP + Q = 0</text><text x="600.0" y="301.0" font-size="14" font-weight="400" fill="#0f172a" text-anchor="middle">(finite tf: the ODE backward from S)</text><rect x="850" y="226" width="290" height="96" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="995.0" y="259.0" font-size="15" font-weight="650" fill="#0f172a" text-anchor="middle">Gain</text><text x="995.0" y="280.0" font-size="14" font-weight="400" fill="#0f172a" text-anchor="middle">K = R⁻¹BᵀP</text><text x="995.0" y="301.0" font-size="14" font-weight="400" fill="#0f172a" text-anchor="middle">(K(t) on a finite horizon)</text><path d="M350,274.0 L408,274.0" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr)"/><path d="M790,274.0 L848,274.0" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr)"/><path d="M995.0,322 L995.0,390" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr)"/><rect x="850" y="392" width="290" height="96" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/><text x="995.0" y="425.0" font-size="15" font-weight="650" fill="#0c4a6e" text-anchor="middle">Poles</text><text x="995.0" y="446.0" font-size="14" font-weight="400" fill="#0c4a6e" text-anchor="middle">eig(A − BK)</text><text x="995.0" y="467.0" font-size="14" font-weight="400" fill="#0c4a6e" text-anchor="middle">stable in the left half-plane</text><rect x="410" y="392" width="380" height="96" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/><text x="600.0" y="425.0" font-size="15" font-weight="650" fill="#0c4a6e" text-anchor="middle">Cost-to-go</text><text x="600.0" y="446.0" font-size="14" font-weight="400" fill="#0c4a6e" text-anchor="middle">J(x) = (x − x̄)ᵀP(x − x̄)</text><text x="600.0" y="467.0" font-size="14" font-weight="400" fill="#0c4a6e" text-anchor="middle">of the linear model</text><rect x="60" y="392" width="290" height="96" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/><text x="205.0" y="425.0" font-size="15" font-weight="650" fill="#0c4a6e" text-anchor="middle">PlanningSolution</text><text x="205.0" y="446.0" font-size="14" font-weight="400" fill="#0c4a6e" text-anchor="middle">policy u = ū − K(x − x̄)</text><text x="205.0" y="467.0" font-size="14" font-weight="400" fill="#0c4a6e" text-anchor="middle">a StateFeedback block</text><path d="M850,440.0 L792,440.0" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr)"/><path d="M410,440.0 L352,440.0" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr)"/></svg>