<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 540" width="1180" height="540" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker><marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="arrp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9333ea"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="30" y="26" width="1120" height="152" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><text x="46" y="48" font-size="13.5" font-weight="600" fill="#64748b" text-anchor="start">Model · every block a System, the diagram a System</text><rect x="60" y="70" width="220" height="86" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/><text x="170.0" y="98.0" font-size="15" font-weight="650" fill="#0c4a6e" text-anchor="middle">Plant</text><text x="170.0" y="119.0" font-size="14" font-weight="400" fill="#0c4a6e" text-anchor="middle">ẋ = f(x, u, t; p)</text><text x="170.0" y="140.0" font-size="14" font-weight="400" fill="#0c4a6e" text-anchor="middle">y = h(x, u, t; p)</text><rect x="330" y="70" width="220" height="86" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/><text x="440.0" y="108.0" font-size="15" font-weight="650" fill="#0c4a6e" text-anchor="middle">Controller</text><text x="440.0" y="129.0" font-size="14" font-weight="400" fill="#0c4a6e" text-anchor="middle">u = π(y; p)</text><path d="M550,113.0 L598,113.0" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr)"/><text x="574" y="105.0" font-size="15" font-weight="700" fill="#64748b" text-anchor="middle">@</text><rect x="600" y="70" width="520" height="86" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/><text x="860.0" y="98.0" font-size="15" font-weight="650" fill="#0c4a6e" text-anchor="middle">Closed-loop diagram</text><text x="860.0" y="119.0" font-size="14" font-weight="400" fill="#0c4a6e" text-anchor="middle">Ẋ = F(X, U, t; P), one system again</text><text x="860.0" y="140.0" font-size="14" font-weight="400" fill="#0c4a6e" text-anchor="middle">operators @ &gt;&gt; +, or connect</text><rect x="30" y="214" width="1120" height="146" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><text x="46" y="236" font-size="13.5" font-weight="600" fill="#64748b" text-anchor="start">compile(backend): the diagram lowered once</text><path d="M860,178 L860,212" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr)"/><rect x="50" y="248" width="330" height="86" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="215.0" y="276.0" font-size="15" font-weight="650" fill="#0f172a" text-anchor="middle">ExecutionPlan</text><text x="215.0" y="297.0" font-size="14" font-weight="400" fill="#0f172a" text-anchor="middle">block order, wires, state slices</text><text x="215.0" y="318.0" font-size="14" font-weight="400" fill="#0f172a" text-anchor="middle">algebraic loops refused</text><rect x="420" y="248" width="340" height="86" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="590.0" y="276.0" font-size="15" font-weight="650" fill="#0f172a" text-anchor="middle">Evaluator</text><text x="590.0" y="297.0" font-size="14" font-weight="400" fill="#0f172a" text-anchor="middle">f, h, rollout as arrays</text><text x="590.0" y="318.0" font-size="14" font-weight="400" fill="#0f172a" text-anchor="middle">NumPy, or JAX: jit · grad · vmap</text><rect x="800" y="248" width="330" height="86" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="965.0" y="276.0" font-size="15" font-weight="650" fill="#0f172a" text-anchor="middle">Parameters</text><text x="965.0" y="297.0" font-size="14" font-weight="400" fill="#0f172a" text-anchor="middle">params = None: the snapshot</text><text x="965.0" y="318.0" font-size="14" font-weight="400" fill="#0f172a" text-anchor="middle">or a complete tree</text><path d="M190,360 L190,412" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr)"/><path d="M975,360 L975,412" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr)"/><rect x="60" y="414" width="260" height="86" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="190.0" y="442.0" font-size="15" font-weight="650" fill="#0f172a" text-anchor="middle">Simulator</text><text x="190.0" y="463.0" font-size="14" font-weight="400" fill="#0f172a" text-anchor="middle">integrate ẋ = f from x₀</text><text x="190.0" y="484.0" font-size="14" font-weight="400" fill="#0f172a" text-anchor="middle">solve_ivp or fixed-step RK4</text><rect x="360" y="418" width="150" height="78" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/><text x="435.0" y="462.0" font-size="15" font-weight="650" fill="#0c4a6e" text-anchor="middle"></text><path d="M378,448 C392,426 404,464 418,444 S440,438 492,440" fill="none" stroke="#0284c7" stroke-width="2"/><text x="435.0" y="466" font-size="15" font-weight="650" fill="#0c4a6e" text-anchor="middle">Trajectory</text><text x="435.0" y="485" font-size="13.5" font-weight="400" fill="#0c4a6e" text-anchor="middle">x(t), u(t), y(t)</text><rect x="550" y="414" width="170" height="86" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/><text x="635.0" y="442.0" font-size="15" font-weight="650" fill="#0c4a6e" text-anchor="middle">Plots, animation</text><text x="635.0" y="463.0" font-size="14" font-weight="400" fill="#0c4a6e" text-anchor="middle">plot_trajectory</text><text x="635.0" y="484.0" font-size="14" font-weight="400" fill="#0c4a6e" text-anchor="middle">animate</text><path d="M320,457.0 L358,457.0" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr)"/><path d="M510,457.0 L548,457.0" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr)"/><rect x="830" y="414" width="290" height="86" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="975.0" y="442.0" font-size="15" font-weight="650" fill="#0f172a" text-anchor="middle">Analysis</text><text x="975.0" y="463.0" font-size="14" font-weight="400" fill="#0f172a" text-anchor="middle">linearize: A, B, C, D</text><text x="975.0" y="484.0" font-size="14" font-weight="400" fill="#0f172a" text-anchor="middle">poles · Bode · margins</text></svg>