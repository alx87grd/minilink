<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 520" width="1180" height="520" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker><marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="arrp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9333ea"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="30" y="26" width="1120" height="142" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><text x="46" y="48" font-size="13.5" font-weight="600" fill="#64748b" text-anchor="start">PlanningProblem</text><rect x="50.0" y="70" width="196.8" height="76" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/><text x="148.4" y="103.0" font-size="15" font-weight="650" fill="#0c4a6e" text-anchor="middle">Plant</text><text x="148.4" y="124.0" font-size="14" font-weight="400" fill="#0c4a6e" text-anchor="middle">ẋ = f(x, u)</text><rect x="270.8" y="70" width="196.8" height="76" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/><text x="369.20000000000005" y="103.0" font-size="15" font-weight="650" fill="#0c4a6e" text-anchor="middle">Cost</text><text x="369.20000000000005" y="124.0" font-size="14" font-weight="400" fill="#0c4a6e" text-anchor="middle">∫ g dt + h(x(tf))</text><rect x="491.6" y="70" width="196.8" height="76" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/><text x="590.0" y="103.0" font-size="15" font-weight="650" fill="#0c4a6e" text-anchor="middle">Sets</text><text x="590.0" y="124.0" font-size="14" font-weight="400" fill="#0c4a6e" text-anchor="middle">x ∈ X,  u ∈ U</text><rect x="712.4000000000001" y="70" width="196.8" height="76" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/><text x="810.8000000000001" y="103.0" font-size="15" font-weight="650" fill="#0c4a6e" text-anchor="middle">Goal</text><text x="810.8000000000001" y="124.0" font-size="14" font-weight="400" fill="#0c4a6e" text-anchor="middle">x(tf) ∈ Xf</text><rect x="933.2" y="70" width="196.8" height="76" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/><text x="1031.6000000000001" y="103.0" font-size="15" font-weight="650" fill="#0c4a6e" text-anchor="middle">Start</text><text x="1031.6000000000001" y="124.0" font-size="14" font-weight="400" fill="#0c4a6e" text-anchor="middle">x(0) = x₀</text><rect x="30" y="192" width="1120" height="156" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><text x="46" y="214" font-size="13.5" font-weight="600" fill="#64748b" text-anchor="start">Transcription · direct collocation (or single, multiple shooting): no simulation, the dynamics become constraints</text><path d="M590,168 L590,190" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr)"/><rect x="50" y="226" width="220" height="96" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="160.0" y="259.0" font-size="15" font-weight="650" fill="#0f172a" text-anchor="middle">Decision vector</text><text x="160.0" y="280.0" font-size="14" font-weight="400" fill="#0f172a" text-anchor="middle">z = (x₀ … xₙ, u₀ … uₙ)</text><text x="160.0" y="301.0" font-size="14" font-weight="400" fill="#0f172a" text-anchor="middle">the knots of the trajectory</text><rect x="294" y="226" width="300" height="96" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="444.0" y="259.0" font-size="15" font-weight="650" fill="#0f172a" text-anchor="middle">Dynamics as defects</text><text x="444.0" y="280.0" font-size="14" font-weight="400" fill="#0f172a" text-anchor="middle">xₖ₊₁ − xₖ − dt/2 (fₖ + fₖ₊₁) = 0</text><text x="444.0" y="301.0" font-size="14" font-weight="400" fill="#0f172a" text-anchor="middle">on every interval</text><rect x="618" y="226" width="250" height="96" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="743.0" y="259.0" font-size="15" font-weight="650" fill="#0f172a" text-anchor="middle">Cost as a sum</text><text x="743.0" y="280.0" font-size="14" font-weight="400" fill="#0f172a" text-anchor="middle">Σ dt/2 (gₖ + gₖ₊₁) + h(xₙ)</text><text x="743.0" y="301.0" font-size="14" font-weight="400" fill="#0f172a" text-anchor="middle">the trapezoidal rule</text><rect x="892" y="226" width="210" height="96" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="997.0" y="259.0" font-size="15" font-weight="650" fill="#0f172a" text-anchor="middle">Sets as rows</text><text x="997.0" y="280.0" font-size="14" font-weight="400" fill="#0f172a" text-anchor="middle">xₖ ∈ X, uₖ ∈ U</text><text x="997.0" y="301.0" font-size="14" font-weight="400" fill="#0f172a" text-anchor="middle">xₙ ∈ Xf</text><path d="M590,348 L590,394" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr)"/><rect x="60" y="396" width="260" height="96" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="190.0" y="429.0" font-size="15" font-weight="650" fill="#0f172a" text-anchor="middle">MathematicalProgram</text><text x="190.0" y="450.0" font-size="14" font-weight="400" fill="#0f172a" text-anchor="middle">min J(z)</text><text x="190.0" y="471.0" font-size="14" font-weight="400" fill="#0f172a" text-anchor="middle">s.t. h(z) = 0, g(z) ≥ 0</text><rect x="380" y="396" width="200" height="96" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="480.0" y="429.0" font-size="15" font-weight="650" fill="#0f172a" text-anchor="middle">Optimizer</text><text x="480.0" y="450.0" font-size="14" font-weight="400" fill="#0f172a" text-anchor="middle">SLSQP · Ipopt</text><text x="480.0" y="471.0" font-size="14" font-weight="400" fill="#0f172a" text-anchor="middle">from a first guess z₀</text><rect x="640" y="400" width="150" height="88" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/><text x="715.0" y="449.0" font-size="15" font-weight="650" fill="#0c4a6e" text-anchor="middle"></text><path d="M658,430 C672,408 684,446 698,426 S720,420 772,422" fill="none" stroke="#0284c7" stroke-width="2"/><text x="715.0" y="458" font-size="15" font-weight="650" fill="#0c4a6e" text-anchor="middle">Trajectory</text><text x="715.0" y="477" font-size="13.5" font-weight="400" fill="#0c4a6e" text-anchor="middle">x*(t), u*(t)</text><rect x="850" y="396" width="290" height="96" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/><text x="995.0" y="429.0" font-size="15" font-weight="650" fill="#0c4a6e" text-anchor="middle">PlanningSolution</text><text x="995.0" y="450.0" font-size="14" font-weight="400" fill="#0c4a6e" text-anchor="middle">policy u = π(t), open loop</text><text x="995.0" y="471.0" font-size="14" font-weight="400" fill="#0c4a6e" text-anchor="middle">or tracked; MPC re-solves</text><path d="M320,444.0 L378,444.0" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr)"/><path d="M580,444.0 L638,444.0" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr)"/><path d="M790,444.0 L848,444.0" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr)"/><text x="610.0" y="436.0" font-size="13" font-weight="600" fill="#64748b" text-anchor="middle">z*</text></svg>