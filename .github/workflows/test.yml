# CI — entry points documented in tests/README.md#entry-points
# Jobs: test (ruff + pytest, py3.10–3.13) → regression (regression gates, py3.12 + jax)
name: CI

on:
  push:
    branches: [main, refactor-v4, dev-alex]
  pull_request:
    branches: [main, refactor-v4, dev-alex]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Lint with Ruff
      run: ruff check .

    - name: Check formatting with Ruff
      run: ruff format --check .

    - name: Test with pytest
      run: pytest

  regression:
    runs-on: ubuntu-latest
    needs: test

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install dependencies (with JAX)
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev,jax]"

    - name: Layer-B regression (solve-speed gates)
      env:
        PYTHONPATH: ${{ github.workspace }}
      run: |
        python benchmarks/run_regression_check.py --suite all --tiny \
          --factor 6 \
          --speed-gate-suffixes solve_s,nlp_s,speedup
