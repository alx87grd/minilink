# CI — entry points documented in tests/README.md#entry-points
# Jobs: test (ruff + pytest, py3.10–3.13; coverage report on 3.12, no gate)
#   → regression (pytest + gates + flagships + notebooks, py3.12 + jax);
# packaging (build, check and import the wheel) and laptops (Basic tier pytest +
# notebook smoke on Windows and macOS, py3.12) run beside them.
name: CI

on:
  push:
    branches: [main, refactor-v4, dev-alex, dev]
  pull_request:
    branches: [main, refactor-v4, dev-alex, dev]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev,rl,diagrams]"

    - name: Lint with Ruff
      run: ruff check .

    - name: Check formatting with Ruff
      run: ruff format --check .

    - name: Test with pytest
      if: matrix.python-version != '3.12'
      run: pytest

    # Coverage is reported, not gated: one leg, no fail-under threshold.
    - name: Test with pytest (coverage report)
      if: matrix.python-version == '3.12'
      run: pytest --cov=minilink --cov-report=term --cov-report=markdown-append:"$GITHUB_STEP_SUMMARY"

  # Students' laptops: the Basic tier (NumPy, SciPy, Matplotlib; no Graphviz,
  # JAX or other extras) on Windows and macOS. Tests and notebooks that need an
  # extra skip, as they do on a Basic install.
  laptops:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    defaults:
      run:
        shell: bash
    # UTF-8 on the runner pipes that the test harness reads from its subprocesses.
    env:
      PYTHONUTF8: "1"
      MPLBACKEND: Agg

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install the Basic tier and the test tools
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Test with pytest
      run: pytest

    # Teaching notebooks: the ones the Basic tier runs; the rest skip on their extra.
    - name: Notebook smoke checks
      if: ${{ !cancelled() }}
      env:
        PYTHONPATH: ${{ github.workspace }}
      run: |
        python tests/demo_checks/run_notebook_checks.py

  packaging:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Build sdist and wheel
      run: |
        python -m pip install --upgrade pip build twine
        python -m build

    - name: Check the artifacts
      run: |
        python tests/demo_checks/check_wheel.py dist/*.whl dist/*.tar.gz
        python -m twine check dist/*

    - name: Install the wheel and import
      run: |
        python -m venv /tmp/wheel-env
        /tmp/wheel-env/bin/pip install dist/*.whl
        /tmp/wheel-env/bin/python -c "import minilink; from minilink import Pendulum; print(minilink.__version__)"

  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    needs: test

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install system dependencies
      run: sudo apt-get update && sudo apt-get install -y graphviz

    - name: Install dependencies (with JAX + viz)
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev,jax,visualization,plotting,diagrams,rl]"

    # JAX tests skip in the ``test`` job (no jax extra); gate them here.
    - name: Test with pytest (incl. JAX)
      env:
        SDL_VIDEODRIVER: dummy
      run: pytest

    # The gates, flagships and notebooks report even when a unit test failed.
    - name: Regression gates
      if: ${{ !cancelled() }}
      env:
        PYTHONPATH: ${{ github.workspace }}
      run: |
        python benchmarks/run_regression_check.py --suite all --tiny \
          --factor 10 \
          --speed-gate-suffixes solve_s,nlp_s,speedup \
          --speed-slack-s 0.1

    # JAX flagships skip in the ``test`` job (no jax extra); gate them here.
    # Interactive flagships (viewer demos) stay skipped in both jobs.
    - name: Flagship demo checks (incl. JAX)
      if: ${{ !cancelled() }}
      env:
        PYTHONPATH: ${{ github.workspace }}
        MPLBACKEND: Agg
      run: |
        python tests/demo_checks/run_flagship_demos.py

    # Teaching notebooks: execute code cells; fail on error (once, with JAX).
    - name: Notebook smoke checks
      if: ${{ !cancelled() }}
      env:
        PYTHONPATH: ${{ github.workspace }}
        MPLBACKEND: Agg
        SDL_VIDEODRIVER: dummy
      run: |
        python tests/demo_checks/run_notebook_checks.py
