# Nightly — everything the per-push gates leave out, with the full optional
# stack (every extra, Ipopt, Stable-Baselines3 on CPU torch): the whole pytest
# suite (symbolic, Ipopt and slow tests included), every example script, and every
# teaching notebook (`--all`: the ones marked `smoke: false` in
# notebook_overrides.json too, except `nightly: false`). Not a merge gate (see tests/README.md); CI's jobs are the per-push
# gates. Also the other Pythons (3.10, 3.11, 3.13) and the students' laptops. Run on demand with
# workflow_dispatch.
name: Nightly demos

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

jobs:
  demos:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install system dependencies
      run: sudo apt-get update && sudo apt-get install -y graphviz coinor-libipopt-dev libblas-dev liblapack-dev pkg-config

    # Stable-Baselines3 is not a minilink extra: the SB3 notebooks need it and
    # torch, installed from the CPU wheel index (the default wheel pulls CUDA).
    - name: Install dependencies (full optional stack)
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev,full]"
        pip install graphviz cyipopt
        pip install torch --index-url https://download.pytorch.org/whl/cpu
        pip install stable-baselines3

    # A missing package would only skip its tests and notebooks; fail instead.
    - name: Check the optional stack imports
      run: python -c "import cyipopt, sympy, jax, graphviz, meshcat, pygame, plotly, gymnasium, torch, stable_baselines3"

    - name: Test with pytest (every marker, the slow tests included)
      env:
        SDL_VIDEODRIVER: dummy
      run: pytest --runslow

    # The experimental tier's tests: off the merge gate, smoked here (ROADMAP §2)
    - name: Test the experimental tier
      if: ${{ !cancelled() }}
      env:
        SDL_VIDEODRIVER: dummy
      run: pytest tests/experimental

    - name: All example scripts under examples/demos
      if: ${{ !cancelled() }}
      env:
        PYTHONPATH: ${{ github.workspace }}
        MPLBACKEND: Agg
        SDL_VIDEODRIVER: dummy
      run: |
        python tests/demo_checks/run_all_demos.py --timeout 900 --continue-on-error

    - name: Teaching notebooks (all, long ones included)
      if: ${{ !cancelled() }}
      env:
        PYTHONPATH: ${{ github.workspace }}
        MPLBACKEND: Agg
        SDL_VIDEODRIVER: dummy
      run: |
        python tests/demo_checks/run_notebook_checks.py --all --timeout 1800

  # The other supported Pythons and the students' laptops (CI runs them on pull requests
  # into main only)
  pythons:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.13"]

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
        pip install gymnasium graphviz

    - name: Test with pytest
      env:
        MPLBACKEND: Agg
      run: pytest -n auto

  # Students' laptops: the Basic tier (NumPy, SciPy, Matplotlib; no Graphviz,
  # JAX or other extras) on Windows and macOS. Tests
  # and notebooks that need an extra skip, as they do on a Basic install.
  laptops:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    defaults:
      run:
        shell: bash
    # UTF-8 on the runner pipes that the test harness reads from its subprocesses.
    env:
      PYTHONUTF8: "1"
      MPLBACKEND: Agg

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install the Basic tier and the test tools
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Test with pytest
      run: pytest -n auto

    # Teaching notebooks: the ones the Basic tier runs; the rest skip on their extra.
    - name: Notebook smoke checks
      if: ${{ !cancelled() }}
      env:
        PYTHONPATH: ${{ github.workspace }}
      run: |
        python tests/demo_checks/run_notebook_checks.py --jobs 2
