# Publish minilink to PyPI from a 0.* git tag (hatch-vcs; not v0.1.0).
# One-time: GitHub Environment `pypi` + PyPI trusted publisher for this workflow.
# workflow_dispatch without a tag only builds; it does not upload.
name: Publish

on:
  push:
    tags:
      - "0.*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build

      - name: Check the artifacts
        run: |
          python tests/demo_checks/check_wheel.py dist/*.whl dist/*.tar.gz
          python -m twine check dist/*

      - name: Version matches the tag
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        run: |
          tag=${GITHUB_REF#refs/tags/}
          ls "dist/minilink-${tag}-"*.whl "dist/minilink-${tag}.tar.gz"

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/minilink
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - uses: pypa/gh-action-pypi-publish@release/v1
