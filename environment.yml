# Full tier — notebooks, JAX, animators, symbolic, PPO, plus dev tools and Ipopt.
# Pip mirror: requirements-full.txt (minus dev tools and Ipopt).
# Basic tier: environment-basic.yml. Tiers: install.md.
#
# Conda-forge package names differ from PyPI where noted in comments.
#
# Create:
#   conda env create -f environment.yml
#   conda activate minilink
#   pip install -e .
#
# `pip install -e .` registers the package in this env (and writes
# minilink/_version.py). PYTHONPATH="$PWD" still works as a fallback.
#
# CI tests Python 3.10–3.13; pin below to match your local conda env.

name: minilink
channels:
  - conda-forge
dependencies:
  - python=3.13
  - pip

  # --- core (pyproject [project].dependencies + scipy/matplotlib usage) ---
  - numpy
  - scipy
  - matplotlib
  - graphviz          # Graphviz binaries (dot)
  - python-graphviz   # `import graphviz` in graphical/diagrams/dot.py

  # --- optional: jax ([jax]) ---
  - jax
  - jaxlib

  # --- optional: symbolic ([symbolic]) ---
  - sympy

  # --- optional: visualization ([visualization]) ---
  - meshcat-python    # PyPI name: meshcat
  - pygame

  # --- optional: plotting ([plotting]) ---
  - plotly

  # --- optional: ipopt ([ipopt]) ---
  - ipopt             # native solver library
  - cyipopt           # `from cyipopt import minimize_ipopt`

  # --- optional: rl ([rl] = gymnasium; SB3/torch for PPO teaching notebooks) ---
  - gymnasium
  - pytorch
  - stable-baselines3

  # --- dev ([dev] + docs) ---
  - pytest
  - ruff
  - pre-commit
  - sphinx

  # --- notebooks / inline display (IPython in diagrams, meshcat, plotly) ---
  - ipython
  - ipykernel
  - jupyter
  - jupyterlab
  - notebook
