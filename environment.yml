# The minilink environment: everything the courses use, the dev tools included.
#   conda env create -f environment.yml && conda activate minilink
#   conda env config vars set PYTHONPATH="$PWD" && conda deactivate && conda activate minilink
# CI tests Python 3.10–3.13. Conda-forge names differ from PyPI where noted.

name: minilink
channels:
  - conda-forge
dependencies:
  - python=3.13
  - pip

  # Core
  - numpy
  - scipy
  - matplotlib
  - graphviz          # Graphviz binaries (dot)
  - python-graphviz   # `import graphviz` in graphical/diagrams/dot.py

  # JAX
  - jax
  - jaxlib

  # Symbolic
  - sympy

  # Animation
  - meshcat-python    # PyPI name: meshcat
  - pygame

  # Plotly
  - plotly

  # Ipopt
  - ipopt             # native solver library
  - cyipopt           # `from cyipopt import minimize_ipopt`

  # Reinforcement learning (Stable-Baselines3 and torch for its teaching notebooks)
  - gymnasium
  - pytorch
  - stable-baselines3

  # Dev tools
  - pytest
  - pytest-cov
  - ruff
  - pre-commit
  - nbstripout
  - python-build      # PyPI name: build
  - twine
  - sphinx
  - furo

  # Notebooks
  - ipython
  - ipykernel
  - jupyter
  - jupyterlab
  - notebook
