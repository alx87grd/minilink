# Install: pip install -e ".[dev]" && pre-commit install
# Run every hook on the whole tree: pre-commit run --all-files

repos:
  - repo: https://github.com/kynan/nbstripout
    rev: 0.9.1
    hooks:
      - id: nbstripout
        files: ^examples/.*\.ipynb$

  # The CI lint steps, run with the ruff the dev extra installs
  # (pip install -e ".[dev]"), so a hook and CI never disagree on a version.
  - repo: local
    hooks:
      - id: ruff
        name: ruff check
        entry: ruff check .
        language: system
        pass_filenames: false
        types_or: [python, pyi, jupyter]
      - id: ruff-format
        name: ruff format --check
        entry: ruff format --check .
        language: system
        pass_filenames: false
        types_or: [python, pyi, jupyter]
